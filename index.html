<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMR Assignment 1</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; sourceWidth: 480; sourceHeight: 640; displayWidth: 480; displayHeight: 640; debugUIEnabled: false;"

    <a-marker preset="hiro">

        <a-entity
            gltf-model="url(assets/optimized_asset_draco.glb)"
            scale="0.2 0.2 0.2"
            position="0 0 0">
        </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
